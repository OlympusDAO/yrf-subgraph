type NextYieldSet @entity(immutable: true) {
  id: Bytes!
  nextYield: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type RepoMarket @entity(immutable: true) {
  id: Bytes!
  marketId: BigInt! # uint256
  bidAmount: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Shutdown @entity(immutable: true) {
  id: Bytes!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}
