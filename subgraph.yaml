specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: YieldRepurchaseFacility
    network: mainnet
    source:
      address: "0x271e35a8555a62F6bA76508E85dfD76D580B0692"
      abi: YieldRepurchaseFacility
      startBlock: 21814037
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - NextYieldSet
        - RepoMarket
        - Shutdown
      abis:
        - name: YieldRepurchaseFacility
          file: ./abis/YieldRepurchaseFacility.json
      eventHandlers:
        - event: NextYieldSet(uint256)
          handler: handleNextYieldSet
        - event: RepoMarket(uint256,uint256)
          handler: handleRepoMarket
        - event: Shutdown()
          handler: handleShutdown
      file: ./src/yield-repurchase-facility.ts
